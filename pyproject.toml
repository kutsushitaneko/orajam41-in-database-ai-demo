[project]
name = "orajam41-demo"
version = "0.1.0"
description = "Oracle AI Jam 41 environment checks and demos"
requires-python = ">=3.12,<3.13"
dependencies = [
  "oracledb>=3.3,<5",
  "oci>=2.160,<3",
  "python-dotenv>=1.1,<2",
  "sqlglot>=27,<31",
]

[dependency-groups]
dev = [
    "pillow>=11,<13",
    "pytest>=8,<10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/webinar_demo"]

[tool.pytest.ini_options]
testpaths = ["tests"]
